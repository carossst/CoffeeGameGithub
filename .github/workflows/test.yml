name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # npm 10.9.8 has a known Arborist edgesOut install failure on Node 22.
      # Pin a known-working npm 11 release before resolving dependencies fresh.
      - run: npm install --global npm@11.6.0
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm test
      - run: npm run content:check
      - run: npm run syntax:check
      - run: npm run format:check
